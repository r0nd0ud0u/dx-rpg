[application]

# App (Project) Name — shown as the window title, Android app label, and
# (via [bundle].identifier below) folds into the RPM/deb/APK package name.
name = "RPG Adventure"

# Dioxus App Default Platform
# web, desktop, fullstack
default_platform = "fullstack"

# resource (assets) file folder
asset_dir = "assets"

# `build` & `serve` output path
out_dir = "bundle"

[web.app]

# HTML title tag content
title = "RPG Adventure"

[web.watcher]

# when watcher trigger, regenerate the `index.html`
reload_html = true

# which files or dirs will be watcher monitoring
watch_path = ["src", "assets"]

# Javascript code file
script = []

# include `assets` in web platform
[web.resource]

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []

[bundle]
# Changing this changes the Android application ID and the RPM/deb package
# name — see the matching update to the hardcoded Android data-dir path in
# src/main.rs, which must stay in sync with this identifier or the app reads/
# writes the wrong /data/data/<id>/ directory on Android.
#
# Android builds (build-mobile and build-android-aab in bundle_to_asset.yml)
# override this at CI time to "com.aogin.rpgadventure" — the package name
# Play Console requires — without touching desktop/web packaging here. See
# those jobs' "Patch Dioxus.toml with Android package name"/"...release
# signing config" steps.
identifier = "io.github.r0ndoudou.rpgadventure"
publisher = "r0ndoudou"
resources = ["assets/*"]

# Desktop icon, read off disk at bundle time. Must be square: dx derives the hicolor
# size folder from the PNG's own dimensions. Linux/macOS only — Windows uses
# [bundle.windows] below, and dx 0.7.10 ignores all of these for Android
# (see scripts/patch_android_icon.sh).
icon = ["assets/icon-512.png"]

# .deb/.rpm declare webkit2gtk and libxdo as package deps so apt/dnf install them; the
# AppImage can't (webkit2gtk's helpers don't relocate) and still needs them preinstalled.
# libxdo.so.3 is a runtime need of the keyboard-shortcut support linked in by
# bundle_to_asset.yml.
#
# dx 0.7.10 has no [bundle.rpm] table — bundle_linux_rpm() reuses DebianSettings wholesale,
# so these deb-style names land in the .rpm's Requires too, and bundle_to_asset.yml's
# "Fix RPM dependency names" step rewrites them (webkit2gtk4.1, libxdo).
[bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libxdo3"]

# AppStream metadata (see the file for why). bundle_linux_rpm() reuses this map, so it
# covers both package formats.
[bundle.deb.files]
"/usr/share/metainfo/io.github.r0ndoudou.rpgadventure.metainfo.xml" = "assets/io.github.r0ndoudou.rpgadventure.metainfo.xml"

# dx's Windows bundler ignores [bundle].icon above; it needs this instead. Reuses the
# web favicon, already a multi-resolution .ico.
[bundle.windows]
icon_path = "assets/favicon.ico"

# Without this section dx runs `assembleDebug`, which signs with AGP's own unseeded
# ~/.android/debug.keystore — a fresh key per CI run, so Android refuses to install over
# the previous release. Pointing at the committed keystore makes signing deterministic.
# Standard debug-keystore credentials, not a secret (see bundle_to_asset.yml).
[bundle.android]
jks_file = "android/debug.keystore"
jks_password = "android"
key_alias = "androiddebugkey"
key_password = "android"
