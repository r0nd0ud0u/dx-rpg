# /etc/nginx/sites-available/dx-rpg
# À activer : sudo ln -s /etc/nginx/sites-available/dx-rpg /etc/nginx/sites-enabled/dx-rpg
# Puis : sudo nginx -t && sudo systemctl reload nginx
#
# Prérequis : Let's Encrypt avec certbot
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d aogin-world.com -d www.aogin-world.com
#
# Renouvellement : certbot installe normalement un timer/cron qui renouvelle
# automatiquement le certificat quand il reste < 30 jours avant expiration.
# Vérifier que c'est bien en place (aucune action manuelle requise sinon) :
#   systemctl list-timers | grep certbot
#   sudo certbot renew --dry-run
#
# SQLite web UI (/db/) : protégé par auth_basic + htpasswd (voir location /db/
# ci-dessous). Générer/mettre à jour le mot de passe avec :
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd admin   # -c écrase le fichier, à omettre pour ajouter un user

# Rate limiting basique par IP — première ligne de défense contre les floods
# applicatifs (contexte http, valide ici car ce fichier est inclus depuis
# /etc/nginx/sites-enabled/ à l'intérieur du bloc http {}).
# Ne s'applique qu'aux nouvelles requêtes/connexions HTTP (login, appels API,
# handshake du websocket), pas aux frames échangées une fois la connexion
# websocket établie.
limit_req_zone $binary_remote_addr zone=dxrpg_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dxrpg_conn:10m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name aogin-world.com www.aogin-world.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aogin-world.com www.aogin-world.com;

    ssl_certificate     /etc/letsencrypt/live/aogin-world.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aogin-world.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Main app — server functions (login, save, admin, ...) + websocket
    # (/api/new-event, voir src/websocket_handler/event.rs)
    location /api/ {
        # burst=20 nodelay : absorbe les pics légitimes (reconnexion websocket,
        # rechargement de page) sans pénaliser un utilisateur normal.
        limit_req zone=dxrpg_limit burst=20 nodelay;
        # 20 connexions concurrentes par IP : large marge pour un usage normal
        # (plusieurs joueurs derrière un même NAT/box internet, + le websocket
        # de longue durée compte comme 1 connexion tant qu'il reste ouvert).
        limit_conn dxrpg_conn 20;

        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # sqlite-web under /db/ — protégé par auth_basic (défense principale).
    location ^~ /db/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8082/;  # Trailing slash is important!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_set_header Accept-Encoding "";  # Required for sub_filter
        sub_filter_types text/html;
        sub_filter 'href="/' 'href="/db/';
        sub_filter 'src="/' 'src="/db/';
        sub_filter_once off;
    }

    # Optional: static assets for sqlite-web
    location ^~ /db/static/ {
        proxy_pass http://127.0.0.1:8082/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main app catch-all — static WASM/HTML/JS bundle (should be last)
    location / {
        limit_req zone=dxrpg_limit burst=20 nodelay;
        limit_conn dxrpg_conn 20;

        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
