on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Play Store track to upload the AAB to (only used if PLAY_SERVICE_ACCOUNT_JSON is set)'
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

name: Upload Release Asset

permissions:
  contents: write

jobs:
  build-web:
    name: Upload Web Client Asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync package version to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          sed -i "0,/^version = \".*\"/s//version = \"${tag_version}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
        shell: bash
      - name: Update rust
        run: rustup update stable

      # `cargo install cargo-binstall` builds it from source and is prone to
      # breaking on upstream dependency-resolution conflicts in its own Cargo.lock
      # (e.g. duplicate incompatible `compact_str` versions) since `cargo install`
      # doesn't respect the published crate's lockfile by default. The official
      # action instead fetches a prebuilt cargo-binstall binary for the runner's
      # platform, sidestepping that entirely.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.0

      # Same class of failure as the cargo-binstall comment above, one level
      # down: dioxus-cli 0.7.9 does publish a prebuilt Windows binary
      # (dx-x86_64-pc-windows-msvc.zip on its GitHub release), but binstall's
      # default `--strategies` list ends in `compile` as a silent last-resort
      # fallback if fetching/verifying that prebuilt asset ever hiccups. That
      # fallback does an unpinned `cargo install`-style build straight against
      # whatever's newest on crates.io right now, so it isn't reproducible —
      # it broke when it landed on auth-git2 0.5.8 paired with git2 0.21.0,
      # where auth-git2 calls `Cred::credential_helper`, an associated
      # function git2 0.21 doesn't have (E0599). Disabling `compile` here
      # makes the step fail loudly on a real download/network problem
      # instead of intermittently on an incompatible dependency pairing.
      # binstall's GitHub-release check (`crate-meta-data` strategy) hits
      # api.github.com unauthenticated by default, capped at 60 requests/hour
      # per source IP — shared across every GitHub-hosted runner, so it's
      # routinely already exhausted before this step runs, returning 403 and
      # (with `compile` disabled above) failing the whole step outright.
      # binstall reads GITHUB_TOKEN automatically if set; the token GitHub
      # Actions injects into every run for free raises that cap to 5000/hour
      # and needs no extra repo secret.
      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 --force --disable-strategies compile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make bundle script executable (Linux only)
        if: runner.os == 'Linux'
        run: chmod +x ./scripts/bundle_app.sh

      - name: Build project
        run: ./scripts/bundle_app.sh
        shell: bash

      - name: Rename bundle directory
        run: |
          mv bundle rpg-adventure-web_${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
        shell: bash

      - name: Zip bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          zip -r bundle_web_linux.zip rpg-adventure-web_linux
        shell: bash

      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path rpg-adventure-web_windows -DestinationPath bundle_web_windows.zip
        shell: pwsh

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: bundle_web_linux.zip
          path: bundle_web_linux.zip
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bundle_web_windows.zip
          path: bundle_web_windows.zip
          if-no-files-found: error

  build-desktop:
    name: Upload Desktop Client Asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync package version to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Windows (NSIS's VIProductVersion needs strict X.X.X.X) and Linux
          # (RPM's version field rejects '-' outright, and Cargo.toml's version
          # must stay valid SemVer — no '~' either, `cargo metadata` rejects it —
          # so there's no character that satisfies rpm *and* Cargo at once)
          # both need the plain X.Y.Z here; an rc tag like v0.5.6-rc13 fails
          # either leg's packaging otherwise. The full tag (with the -rcN
          # suffix) is preserved separately for release-asset filenames — see
          # the "Extract .deb/.rpm packages" step below and the "Rename bundle
          # directory"/zip steps, which use $GITHUB_REF directly instead of
          # reading this stripped-down Cargo.toml version back out.
          tag_version="${GITHUB_REF#refs/tags/v}"
          tag_version="${tag_version%%-*}"
          sed -i "0,/^version = \".*\"/s//version = \"${tag_version}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
        shell: bash

      - name: Update rust
        run: rustup update stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # cpio is needed by the "Install rpmrebuild" step below (rpmrebuild.sh
          # shells out to it, and it's not guaranteed preinstalled).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libayatana-appindicator3-dev libxdo-dev libglib2.0-dev rpm cpio

      # `cargo install cargo-binstall` builds it from source and is prone to
      # breaking on upstream dependency-resolution conflicts in its own Cargo.lock
      # (e.g. duplicate incompatible `compact_str` versions) since `cargo install`
      # doesn't respect the published crate's lockfile by default. The official
      # action instead fetches a prebuilt cargo-binstall binary for the runner's
      # platform, sidestepping that entirely.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.0

      # Same class of failure as the cargo-binstall comment above, one level
      # down: dioxus-cli 0.7.9 does publish a prebuilt Windows binary
      # (dx-x86_64-pc-windows-msvc.zip on its GitHub release), but binstall's
      # default `--strategies` list ends in `compile` as a silent last-resort
      # fallback if fetching/verifying that prebuilt asset ever hiccups. That
      # fallback does an unpinned `cargo install`-style build straight against
      # whatever's newest on crates.io right now, so it isn't reproducible —
      # it broke when it landed on auth-git2 0.5.8 paired with git2 0.21.0,
      # where auth-git2 calls `Cred::credential_helper`, an associated
      # function git2 0.21 doesn't have (E0599). Disabling `compile` here
      # makes the step fail loudly on a real download/network problem
      # instead of intermittently on an incompatible dependency pairing.
      # binstall's GitHub-release check (`crate-meta-data` strategy) hits
      # api.github.com unauthenticated by default, capped at 60 requests/hour
      # per source IP — shared across every GitHub-hosted runner, so it's
      # routinely already exhausted before this step runs, returning 403 and
      # (with `compile` disabled above) failing the whole step outright.
      # binstall reads GITHUB_TOKEN automatically if set; the token GitHub
      # Actions injects into every run for free raises that cap to 5000/hour
      # and needs no extra repo secret.
      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 --force --disable-strategies compile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make bundle script executable (Linux only)
        if: runner.os == 'Linux'
        run: chmod +x ./scripts/bundle_desktop.sh

      # Same reasoning as build-mobile below: SERVER_URL/INSECURE_ACCEPT_INVALID_CERTS get
      # baked in at build time (see src/main.rs's option_env!() fallback and build.rs) so
      # the released client works out of the box. Override via repo Settings -> Secrets
      # and variables -> Actions -> Variables without touching this file.
      - name: Build desktop client
        run: ./scripts/bundle_desktop.sh
        shell: bash
        env:
          # aogin-world.com has a real Let's Encrypt certificate; the bare IP does not
          # (the cert's CN is the domain, so connecting via IP fails hostname verification),
          # so no INSECURE_ACCEPT_INVALID_CERTS override is needed here anymore.
          SERVER_URL: ${{ vars.SERVER_URL || 'https://aogin-world.com' }}
          INSECURE_ACCEPT_INVALID_CERTS: ${{ vars.INSECURE_ACCEPT_INVALID_CERTS || 'false' }}

      # `dx bundle --package-types deb --package-types rpm` (see scripts/bundle_desktop.sh)
      # puts these next to the AppImage under bundle-desktop/. Pull them out and give
      # them a versioned name before the AppImage-focused "Rename bundle directory"/zip
      # steps below, so they can ship as their own release assets that users can
      # `apt install` / `dnf install` directly, with libwebkit2gtk-4.1-0 / webkit2gtk4.1
      # (see Dioxus.toml [bundle.deb] — dx's .rpm bundler reuses that whole
      # table too, there's no separate [bundle.rpm]) pulled in automatically.
      - name: Extract .deb/.rpm packages (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Use the full git tag (with its -rcN suffix, if any) for the release
          # filename, not Cargo.toml's version: the "Sync package version to git
          # tag" step above strips that suffix from Cargo.toml because rpm/Cargo
          # itself can't represent it, but the filename can and should still
          # distinguish an rc build from a final release. Falls back to
          # Cargo.toml's version for non-tag runs (e.g. workflow_dispatch).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          deb=$(find bundle-desktop -name '*.deb' | head -n1)
          rpm=$(find bundle-desktop -name '*.rpm' | head -n1)
          mv "$deb" "rpg-adventure-desktop-v${version}_amd64.deb"
          mv "$rpm" "rpg-adventure-desktop-v${version}-1.x86_64.rpm"
        shell: bash

      # rpmrebuild isn't packaged for Ubuntu (or current Debian) anymore — verified:
      # `apt-get install rpmrebuild` 404s on noble's repos, and packages.debian.org
      # shows "No such package" on both bookworm and sid. Its only current release
      # channel is the upstream SourceForge project itself (also Fedora's package
      # source). It's pure shell (rpmrebuild + rpmrebuild.sh etc, no compilation),
      # so pointing RPMREBUILD_ROOT_DIR at the extracted tarball and invoking the
      # `rpmrebuild` script directly works without installing anything system-wide.
      - name: Install rpmrebuild (Linux only)
        if: runner.os == 'Linux'
        run: |
          curl -sL "https://sourceforge.net/projects/rpmrebuild/files/rpmrebuild/2.21/rpmrebuild-2.21.tar.gz/download" \
            -o rpmrebuild.tar.gz
          mkdir -p "$RPMREBUILD_ROOT_DIR"
          tar xzf rpmrebuild.tar.gz -C "$RPMREBUILD_ROOT_DIR"
          chmod +x "$RPMREBUILD_ROOT_DIR/rpmrebuild" "$RPMREBUILD_ROOT_DIR"/*.sh
          rm rpmrebuild.tar.gz
        env:
          RPMREBUILD_ROOT_DIR: ${{ github.workspace }}/.rpmrebuild-tool
        shell: bash

      # dioxus-cli 0.7.9's BundleConfig has no `rpm` field at all (verified
      # against packages/cli/src/config/bundle.rs at the v0.7.9 tag) — its
      # .rpm bundler (bundler/linux.rs bundle_linux_rpm()) reuses the entire
      # DebianSettings struct from [bundle.deb] instead, so every entry in
      # the .rpm's Requires ends up as the literal .deb-style package name instead of the
      # RPM one (e.g. "libwebkit2gtk-4.1-0" instead of Fedora's "webkit2gtk4.1",
      # "libxdo3" instead of Fedora's "libxdo") — no RPM-based repo ships
      # packages under those .deb names, so `dnf`/`rpm` refuses the transaction.
      # rpmrebuild patches the built .rpm's spec in place to require the correct
      # RPM-side names instead of the .deb ones baked in by dx. It also has to
      # fill in Summary: dx's rpm-rs backend leaves that RPM tag empty, which
      # rpmbuild (used internally by rpmrebuild) refuses to accept.
      #
      # It also rewrites Release: dx's rpm-rs backend always emits "1" — every
      # -rcN build of the same Cargo.toml version (e.g. rc16, rc18, rc19) ends
      # up as the exact same NEVRA (rpg-adventure-0.5.6-1.x86_64). `dnf`/Discover then
      # treat a newer rc's .rpm as "already installed" and silently keep
      # whatever rc was installed first — which is how a stale build missing
      # this very libxdo fix stayed installed and kept failing to launch after
      # downloading a newer, fixed .rpm. Giving each rc its own Release
      # (0.rcN, e.g. 0.rc19) makes every build a real, distinct, comparable
      # NEVRA: 0.5.6-0.rc16 < 0.5.6-0.rc19 < 0.5.6-1 (a non-rc tag), verified
      # with rpmdev-vercmp. Final releases (no -rcN suffix) keep Release: 1
      # unchanged.
      - name: Fix RPM dependency names and Release (Linux only)
        if: runner.os == 'Linux'
        env:
          RPMREBUILD_ROOT_DIR: ${{ github.workspace }}/.rpmrebuild-tool
        run: |
          rpm=$(find . -maxdepth 1 -name '*.rpm')
          if [[ "$rpm" =~ -rc([0-9]+)-1\.x86_64\.rpm$ ]]; then
            release="0.rc${BASH_REMATCH[1]}"
          else
            release="1"
          fi
          preamble_filter="sed -e 's/^Summary:[[:space:]]*\$/Summary: RPG Adventure desktop client/' -e 's/^Release:.*/Release: ${release}/'"
          bash "$RPMREBUILD_ROOT_DIR/rpmrebuild" -p --notest-install \
            --change-spec-requires="sed -e 's/libwebkit2gtk-4\.1-0/webkit2gtk4.1/' -e 's/libxdo3/libxdo/'" \
            --change-spec-preamble="$preamble_filter" \
            --directory=rpmrebuild-out \
            "$rpm"
          rebuilt=$(find rpmrebuild-out -name '*.rpm')
          mv "$rebuilt" "$rpm"
          rm -rf rpmrebuild-out
          rpm -qp "$rpm"
          rpm -qp --requires "$rpm"
        shell: bash

      - name: Rename bundle directory
        run: |
          mv bundle-desktop rpg-adventure-desktop_${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
        shell: bash

      - name: Zip bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          zip -r bundle_desktop_linux.zip rpg-adventure-desktop_linux
        shell: bash

      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path rpg-adventure-desktop_windows -DestinationPath bundle_desktop_windows.zip
        shell: pwsh

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: bundle_desktop_linux.zip
          path: bundle_desktop_linux.zip
          if-no-files-found: error

      - name: Upload .deb artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rpg-adventure-desktop-deb
          path: rpg-adventure-desktop-v*_amd64.deb
          if-no-files-found: error

      - name: Upload .rpm artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rpg-adventure-desktop-rpm
          path: rpg-adventure-desktop-v*-1.x86_64.rpm
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bundle_desktop_windows.zip
          path: bundle_desktop_windows.zip
          if-no-files-found: error

  build-mobile:
    name: Upload Android Client Asset (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync package version to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          sed -i "0,/^version = \".*\"/s//version = \"${tag_version}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
        shell: bash

      - name: Update rust
        run: rustup update stable

      # arm64-v8a covers essentially every real Android phone since ~2019, and is the
      # only 32-/64-bit split that matters here: dioxus's manganis crate (its asset
      # macro backend) hard-errors on 32-bit Android targets as of dioxus 0.7.9
      # ("Only 64-bit Android targets are supported"), so armv7-linux-androideabi
      # (armeabi-v7a, older 32-bit devices) cannot be built at all with this version.
      - name: Add Android rust target
        run: rustup target add aarch64-linux-android

      # `dx bundle --platform android` also compiles a host-target companion build
      # (visible as `target/server-release`, target x86_64-unknown-linux-gnu) even with
      # --fullstack false. That build pulls in dioxus-desktop's Linux GTK bindings
      # (tao/wry -> glib-sys/gtk-sys), so the same system packages the desktop Linux
      # build needs are required here too, or the build fails on `glib-2.0` via pkg-config.
      # imagemagick is needed by the "Patch Android launcher icon" step below
      # (resizes assets/icon-512.png to each mipmap density).
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libayatana-appindicator3-dev libxdo-dev libglib2.0-dev imagemagick

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME is already set);
      # only the NDK needs to be added explicitly.
      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      # build-tools (aapt2/zipalign/apksigner) is already on this runner (used by the
      # "Print APK signing certificate fingerprint" step below), but platforms;android-34
      # isn't guaranteed — the "Patch Android launcher icon" step needs it to link a
      # tiny standalone resource package against real Android framework resources.
      # sdkmanager no-ops quickly if either is already present.
      - name: Ensure Android build-tools and platform are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      # `cargo install cargo-binstall` builds it from source and is prone to
      # breaking on upstream dependency-resolution conflicts in its own Cargo.lock
      # (e.g. duplicate incompatible `compact_str` versions) since `cargo install`
      # doesn't respect the published crate's lockfile by default. The official
      # action instead fetches a prebuilt cargo-binstall binary for the runner's
      # platform, sidestepping that entirely.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.0

      # Same class of failure as the cargo-binstall comment above, one level
      # down: dioxus-cli 0.7.9 does publish a prebuilt Windows binary
      # (dx-x86_64-pc-windows-msvc.zip on its GitHub release), but binstall's
      # default `--strategies` list ends in `compile` as a silent last-resort
      # fallback if fetching/verifying that prebuilt asset ever hiccups. That
      # fallback does an unpinned `cargo install`-style build straight against
      # whatever's newest on crates.io right now, so it isn't reproducible —
      # it broke when it landed on auth-git2 0.5.8 paired with git2 0.21.0,
      # where auth-git2 calls `Cred::credential_helper`, an associated
      # function git2 0.21 doesn't have (E0599). Disabling `compile` here
      # makes the step fail loudly on a real download/network problem
      # instead of intermittently on an incompatible dependency pairing.
      # binstall's GitHub-release check (`crate-meta-data` strategy) hits
      # api.github.com unauthenticated by default, capped at 60 requests/hour
      # per source IP — shared across every GitHub-hosted runner, so it's
      # routinely already exhausted before this step runs, returning 403 and
      # (with `compile` disabled above) failing the whole step outright.
      # binstall reads GITHUB_TOKEN automatically if set; the token GitHub
      # Actions injects into every run for free raises that cap to 5000/hour
      # and needs no extra repo secret.
      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 --force --disable-strategies compile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make bundle script executable
        run: chmod +x ./scripts/bundle_mobile.sh

      # Dioxus.toml's [bundle.android] section makes dx bundle run `gradlew
      # assembleRelease` with android/debug.keystore wired in explicitly as the
      # signing config, so the APK's signature no longer depends on AGP's implicit
      # default debug keystore (~/.android/debug.keystore via AGP's own
      # preference-directory resolution) — that path was never actually seeded by
      # this workflow's old keystore-copy step, so every run silently signed with a
      # fresh, random, throwaway debug key, and Android refused to install a new
      # build over the previous one ("package conflicts with an existing package").
      #
      # assembleRelease also turns on R8 minification, which enables the
      # `lintVitalRelease`/`lintVitalAnalyzeRelease` task as a dependency. That task
      # is known to crash on some AGP 8.8+/Gradle 9.1+ combinations (dioxus-cli 0.7.9
      # pins AGP 8.7.0 + Gradle 9.1.0 — see DioxusLabs/dioxus#5251); since dx bundle
      # gives no way to pass `-x lintVitalAnalyzeRelease` through to gradle, and the
      # generated gradle project is rewritten from scratch on every build (so we
      # can't just edit its build.gradle.kts), a global Gradle init script is the
      # only way to disable it without depending on dx-cli exposing a flag for it.
      - name: Disable Android lint-vital checks for release builds
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-lint-vital.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin('com.android.application')) {
                      project.android.lint {
                          checkReleaseBuilds = false
                      }
                  }
              }
          }
          EOF

      # An installed APK has no shell to read env vars from at runtime (unlike the
      # desktop client), so SERVER_URL/INSECURE_ACCEPT_INVALID_CERTS must be baked in
      # at build time here — see src/main.rs's option_env!() fallback and build.rs.
      # Override via repo Settings -> Secrets and variables -> Actions -> Variables
      # (SERVER_URL / INSECURE_ACCEPT_INVALID_CERTS) without touching this file; these
      # hardcoded values are just the fallback if no such variable is set.
      - name: Build Android client
        run: ./scripts/bundle_mobile.sh aarch64-linux-android
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # aogin-world.com has a real Let's Encrypt certificate; the bare IP does not
          # (the cert's CN is the domain, so connecting via IP fails hostname verification),
          # so no INSECURE_ACCEPT_INVALID_CERTS override is needed here anymore.
          SERVER_URL: ${{ vars.SERVER_URL || 'https://aogin-world.com' }}
          INSECURE_ACCEPT_INVALID_CERTS: ${{ vars.INSECURE_ACCEPT_INVALID_CERTS || 'false' }}

      - name: Rename APK with version and ABI suffix
        run: |
          apk=$(find bundle-android -name '*.apk' | head -n1)
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          mv "$apk" "bundle-android/rpg-adventure-v${version}-arm64-v8a.apk"

      # dioxus-cli 0.7.9's Android bundler hardcodes its launcher icon to
      # Android Studio's stock "New Project" default (verified by downloading
      # a real release APK and extracting res/*.webp directly) — no
      # Dioxus.toml field reaches that code path. See patch_android_icon.sh
      # for exactly how this surgically patches the built APK's icon
      # resources in place (mipmap bitmaps, adaptive-icon background/
      # foreground, re-sign) since there's no config-level fix.
      - name: Patch Android launcher icon
        run: |
          chmod +x ./scripts/patch_android_icon.sh
          ./scripts/patch_android_icon.sh
        shell: bash

      # Guards against a repeat of the "package conflicts with an existing package"
      # install failure this step is named after: if the debug keystore ever stops
      # being the committed android/debug.keystore (e.g. a future workflow edit drops
      # the "Install stable debug keystore" step, or a runner image change resets
      # ~/.android), the signing certificate's fingerprint changes and this print
      # makes that visible in the run log immediately, instead of surfacing only as
      # a broken install on someone's phone. Compare this SHA-256 across runs if a
      # user reports the install conflict again.
      #
      # Uses apksigner, not keytool: this APK is signed with APK Signature Scheme
      # v2/v3 only (no META-INF/*.RSA entries), which `keytool -printcert -jarfile`
      # can't read at all (it only understands the old JAR-signing convention) — it
      # silently finds nothing and exits non-zero. apksigner (Android SDK
      # build-tools, already on this runner via ANDROID_HOME per the comment above)
      # is the tool that actually understands v2/v3 signatures.
      - name: Print APK signing certificate fingerprint
        run: |
          apk=$(find bundle-android -name '*.apk' | head -n1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle_android_arm64-v8a
          path: bundle-android/rpg-adventure-v*-arm64-v8a.apk
          if-no-files-found: error

  build-android-aab:
    name: Upload Android App Bundle (Play Store)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync package version to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          sed -i "0,/^version = \".*\"/s//version = \"${tag_version}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
        shell: bash

      - name: Update rust
        run: rustup update stable

      - name: Add Android rust target
        run: rustup target add aarch64-linux-android

      # Same as build-mobile: `dx bundle --platform android` also compiles a host-target
      # companion build that pulls in dioxus-desktop's Linux GTK bindings.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libayatana-appindicator3-dev libxdo-dev libglib2.0-dev

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.0

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 --force --disable-strategies compile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Decodes the release keystore into the checkout root as a gitignored file
      # (see .gitignore's /release.keystore entry) rather than $RUNNER_TEMP: dx's
      # generated Gradle config resolves jks_file via Java's `File(projectDir,
      # child)`, which — per its javadoc — silently strips the leading slash off
      # an absolute `child` and joins it onto `projectDir` instead of using it
      # as-is. Pointing jks_file at an absolute $RUNNER_TEMP path therefore
      # produced a mangled path like ".../dx-rpg/dx-rpg/home/runner/.../_temp/
      # release.keystore" and failed with "Keystore file ... not found". A path
      # relative to the checkout root (== Gradle's projectDir here) resolves
      # correctly either way. The "Delete release keystore" step below removes
      # it once the build no longer needs it. This keystore is the app's one
      # production signing identity; it must never be committed to the repo
      # (unlike android/debug.keystore, which is intentionally public/throwaway).
      # Requires these repo secrets to be set (Settings -> Secrets and variables
      # -> Actions):
      #   ANDROID_RELEASE_KEYSTORE_BASE64  - `base64 -w0 release.keystore` output
      #   ANDROID_RELEASE_KEYSTORE_PASSWORD - keystore/key password (PKCS12 keystores
      #                                        use one password for both)
      #   ANDROID_RELEASE_KEY_ALIAS         - key alias
      - name: Decode release keystore
        run: echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}

      # Fails fast with a clear error if ANDROID_RELEASE_KEYSTORE_BASE64 decoded to
      # something that isn't a valid keystore (bad copy/paste into the GitHub secret,
      # stray characters, wrong file encoded, etc.), instead of a confusing
      # KeytoolException 2+ minutes into the Gradle build. keytool ships with the
      # JDK that's already preinstalled on GitHub-hosted ubuntu runners.
      - name: Verify release keystore
        run: keytool -list -keystore release.keystore -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" > /dev/null
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

      # dx has no CLI flag for keystore path/alias/password — [bundle.android] in
      # Dioxus.toml is the only place dx reads Android signing config from. This
      # patches that block, in this job's own throwaway checkout only, to point at
      # the release keystore instead of the committed debug one used by
      # build-mobile's sideloadable test APK.
      - name: Patch Dioxus.toml with release signing config
        run: |
          sed -i \
            -e "s|^jks_file = .*|jks_file = \"release.keystore\"|" \
            -e "s|^jks_password = .*|jks_password = \"${ANDROID_RELEASE_KEYSTORE_PASSWORD}\"|" \
            -e "s|^key_alias = .*|key_alias = \"${ANDROID_RELEASE_KEY_ALIAS}\"|" \
            -e "s|^key_password = .*|key_password = \"${ANDROID_RELEASE_KEYSTORE_PASSWORD}\"|" \
            Dioxus.toml
          grep -A4 '^\[bundle.android\]' Dioxus.toml | sed -E 's/(password = ").*(")/\1***\2/'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

      - name: Make bundle script executable
        run: chmod +x ./scripts/bundle_android_aab.sh

      - name: Build Android App Bundle
        run: ./scripts/bundle_android_aab.sh aarch64-linux-android
        shell: bash
        env:
          SERVER_URL: ${{ vars.SERVER_URL || 'https://aogin-world.com' }}
          INSECURE_ACCEPT_INVALID_CERTS: ${{ vars.INSECURE_ACCEPT_INVALID_CERTS || 'false' }}

      - name: Delete release keystore
        if: always()
        run: rm -f release.keystore

      - name: Rename AAB with version
        run: |
          aab=$(find bundle-android-aab -name '*.aab' | head -n1)
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          mv "$aab" "bundle-android-aab/rpg-adventure-v${version}.aab"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle_android_aab
          path: bundle-android-aab/rpg-adventure-v*.aab
          if-no-files-found: error

      # Optional: auto-publish to Play Console via the Google Play Developer API.
      # Skipped entirely (not failed) when PLAY_SERVICE_ACCOUNT_JSON isn't set, so this
      # workflow keeps working as a plain downloadable-artifact build until that secret
      # exists. Requires, one-time, in Google Cloud + Play Console (neither of which CI
      # can do on your behalf):
      #   1. Enable the "Google Play Android Developer API" on a Google Cloud project.
      #   2. Create a service account in that project, generate a JSON key for it.
      #   3. In Play Console -> Setup -> API access, link that Cloud project, then grant
      #      the service account at least the "Release to testing tracks" permission
      #      (Release manager) for this app.
      #   4. Add the JSON key's raw contents as the PLAY_SERVICE_ACCOUNT_JSON repo secret.
      # Also note: Google Play's API refuses the very first release of a brand-new app
      # listing — that one upload has to be done manually through the Play Console web
      # UI once, after which the API (and this step) works for every release after.
      #
      # `secrets` isn't a valid context in step/job `if:` conditionals (GitHub Actions
      # only exposes it to `env:`/`with:`), so the presence check has to happen in a
      # run step that exports the result via GITHUB_OUTPUT instead.
      - name: Check for Play Store secret
        id: check-play-secret
        run: echo "set=${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload to Play Store
        if: steps.check-play-secret.outputs.set == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.r0ndoudou.rpgadventure
          releaseFiles: bundle-android-aab/rpg-adventure-v*.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed

  build-ios:
    name: Upload iOS Simulator Client Asset
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync package version to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          sed -i '' "0,/^version = \".*\"/s//version = \"${tag_version}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
        shell: bash

      - name: Update rust
        run: rustup update stable

      # aarch64-apple-ios-sim targets the Simulator on Apple Silicon Macs, which is
      # what macos-latest runners are. This produces an UNSIGNED .app (see
      # scripts/bundle_ios.sh) that only runs in Xcode's Simulator — not on a real
      # device, which needs a paid Apple Developer account plus a signing cert and
      # provisioning profile that this workflow deliberately does not set up.
      - name: Add iOS Simulator rust target
        run: rustup target add aarch64-apple-ios-sim

      # `cargo install cargo-binstall` builds it from source and is prone to
      # breaking on upstream dependency-resolution conflicts in its own Cargo.lock
      # (e.g. duplicate incompatible `compact_str` versions) since `cargo install`
      # doesn't respect the published crate's lockfile by default. The official
      # action instead fetches a prebuilt cargo-binstall binary for the runner's
      # platform, sidestepping that entirely.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.0

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 --force --disable-strategies compile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make bundle script executable
        run: chmod +x ./scripts/bundle_ios.sh

      # Same reasoning as build-mobile: SERVER_URL/INSECURE_ACCEPT_INVALID_CERTS get
      # baked in at build time (see src/main.rs's option_env!() fallback and build.rs)
      # so the released client works out of the box. Override via repo Settings ->
      # Secrets and variables -> Actions -> Variables without touching this file.
      - name: Build iOS Simulator client
        run: ./scripts/bundle_ios.sh aarch64-apple-ios-sim
        shell: bash
        env:
          SERVER_URL: ${{ vars.SERVER_URL || 'https://aogin-world.com' }}
          INSECURE_ACCEPT_INVALID_CERTS: ${{ vars.INSECURE_ACCEPT_INVALID_CERTS || 'false' }}

      - name: Zip .app bundle
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          app=$(find bundle-ios -name '*.app' -maxdepth 2 | head -n1)
          ditto -c -k --sequesterRsrc --keepParent "$app" "rpg-adventure-v${version}-ios-simulator.zip"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle_ios_simulator
          path: rpg-adventure-v*-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-web, build-desktop, build-mobile, build-android-aab, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.deb
            artifacts/**/*.rpm