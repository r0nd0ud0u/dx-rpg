name: test

on: 
  push:
  workflow_dispatch:

permissions:
  pull-requests: write
  repository-projects: write

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      # https://github.com/DioxusLabs/dioxus/blob/main/.github/workflows/main.yml#L167
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
          
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          
      - name: Update rust
        run: rustup update stable
    
      # `cargo install cargo-binstall` builds it from source and is prone to
      # breaking on upstream dependency-resolution conflicts in its own Cargo.lock
      # (e.g. duplicate incompatible `compact_str` versions) since `cargo install`
      # doesn't respect the published crate's lockfile by default. The official
      # action instead fetches a prebuilt cargo-binstall binary for the runner's
      # platform, sidestepping that entirely.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      # Same class of failure as the cargo-binstall comment above, one level
      # down: dioxus-cli 0.7.9 does publish a prebuilt binary for every CI
      # platform this repo builds on, but binstall's default `--strategies`
      # list ends in `compile` as a silent last-resort fallback if
      # fetching/verifying that prebuilt asset ever hiccups. That fallback
      # does an unpinned `cargo install`-style build straight against
      # whatever's newest on crates.io right now, so it isn't reproducible —
      # on Windows it broke when it landed on auth-git2 0.5.8 paired with
      # git2 0.21.0, where auth-git2 calls `Cred::credential_helper`, an
      # associated function git2 0.21 doesn't have (E0599). Disabling
      # `compile` here makes the step fail loudly on a real download/network
      # problem instead of intermittently on an incompatible dependency
      # pairing.
      # binstall's GitHub-release check (`crate-meta-data` strategy) hits
      # api.github.com unauthenticated by default, capped at 60 requests/hour
      # per source IP — shared across every GitHub-hosted runner, so it's
      # routinely already exhausted before this step runs, returning 403 and
      # (with `compile` disabled above) failing the whole step outright.
      # binstall reads GITHUB_TOKEN automatically if set; the token GitHub
      # Actions injects into every run for free raises that cap to 5000/hour
      # and needs no extra repo secret.
      - name: install dioxus
        shell: bash
        run: cargo binstall dioxus-cli@0.7.9 --force --disable-strategies compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # https://github.com/DioxusLabs/dioxus/issues/3433
      # - name: check dioxus formatting
      #   shell: bash
      #   run: |
      #     dx fmt --check

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features

      - name: Check dioxus build
        shell: bash
        run: |
          dx build --web